[package]
name = "ovra-app"
description = "Tauri 2 shell for Ovra. Only windows and IPC glue live here (ADR 0002)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ovra"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dev-dependencies]
insta.workspace = true
tempfile = "3"

[dependencies]
ovra-core.workspace = true
ovra-fs-index.workspace = true
ovra-opener.workspace = true
ovra-power.workspace = true
ovra-pty.workspace = true
ovra-remote.workspace = true
ovra-ssh.workspace = true
ovra-agent-runtime.workspace = true
ovra-acp-client.workspace = true
ovra-worktree.workspace = true
ovra-mcp-server.workspace = true
ovra-store.workspace = true
ovra-sandbox.workspace = true
ovra-secrets.workspace = true
ovra-netproxy.workspace = true
ovra-lsp.workspace = true
ovra-browser.workspace = true
ovra-servers.workspace = true
ovra-forge.workspace = true
ovra-resources.workspace = true
ovra-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio = { workspace = true, features = ["sync", "time"] }

[lints]
workspace = true
