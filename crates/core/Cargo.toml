[package]
name = "ovra-core"
description = "Ovra core: protocol and state. No UI or OS dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# In-memory fakes of all services, for tests in other crates.
fakes = ["tokio/rt"]

[dependencies]
base64 = "0.22"
# Local times of schedules from a bundled time-zone database (ADR 0015).
jiff = { version = "1.0.3", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["rt", "sync", "time"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tracing.workspace = true
zeroize = "1"

[dev-dependencies]
insta.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
