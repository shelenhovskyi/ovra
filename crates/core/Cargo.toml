[package]
name = "ovra-core"
description = "Ovra core: protocol and state. No UI or OS dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# In-memory fakes of all services, for tests in other crates.
fakes = ["tokio/rt"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["sync"] }
zeroize = "1"

[dev-dependencies]
insta.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }

[lints]
workspace = true
