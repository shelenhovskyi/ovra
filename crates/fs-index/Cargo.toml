[package]
name = "ovra-fs-index"
description = "File tree, .gitignore handling, git status, watching and content search for project folders (implements ovra_core::services::FsService)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ovra-core.workspace = true
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
notify = "8"
rand.workspace = true
tokio = { workspace = true, features = ["rt"] }
trash = "5"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
ovra-core = { workspace = true, features = ["fakes"] }
insta.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
