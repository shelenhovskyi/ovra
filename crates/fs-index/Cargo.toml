[package]
name = "ovra-fs-index"
description = "File tree, .gitignore handling, git status and watching for project folders (implements ovra_core::services::FsService)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ovra-core.workspace = true
ignore = "0.4"
notify = "8"
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
ovra-core = { workspace = true, features = ["fakes"] }
insta.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
