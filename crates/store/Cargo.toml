[package]
name = "ovra-store"
description = "Persistent project list in SQLite (implements ovra_core::services::ProjectStore)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ovra-core.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }

[dev-dependencies]
ovra-core = { workspace = true, features = ["fakes"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
