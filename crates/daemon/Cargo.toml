[package]
name = "ovra-daemon"
description = "Headless Ovra: the core plus the UI served to a regular browser over WebSocket."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ovra-daemon"
path = "src/main.rs"

[dependencies]
ovra-core.workspace = true
ovra-transport = { workspace = true, features = ["ws"] }
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
rand.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
