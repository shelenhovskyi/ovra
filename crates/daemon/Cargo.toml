[package]
name = "ovra-daemon"
description = "Headless Ovra: the core plus the UI served to a regular browser over WebSocket."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ovra-daemon"
path = "src/main.rs"

[features]
# `--fake-agent`: a scripted agent instead of the user's `claude`, for e2e
# tests and UX reviews. Off in release builds.
fake-agent = ["ovra-core/fakes", "dep:serde_json", "dep:ovra-ssh", "dep:futures-util", "dep:serde"]

[dependencies]
ovra-core.workspace = true
ovra-fs-index.workspace = true
ovra-opener.workspace = true
ovra-power.workspace = true
ovra-pty.workspace = true
ovra-remote.workspace = true
ovra-agent-runtime.workspace = true
ovra-acp-client.workspace = true
ovra-worktree.workspace = true
ovra-mcp-server.workspace = true
ovra-store.workspace = true
ovra-sandbox.workspace = true
ovra-secrets.workspace = true
ovra-netproxy.workspace = true
ovra-lsp.workspace = true
ovra-browser.workspace = true
ovra-servers.workspace = true
ovra-forge.workspace = true
ovra-resources.workspace = true
ovra-transport = { workspace = true, features = ["ws", "stdio"] }
ovra-ssh = { workspace = true, optional = true, features = ["fake"] }
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
futures-util = { workspace = true, optional = true }
rand.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-std", "io-util", "time", "process"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
futures-util.workspace = true
tokio-tungstenite.workspace = true
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true
