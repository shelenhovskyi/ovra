[package]
name = "ovra-daemon"
description = "Headless Ovra: the core plus the UI served to a regular browser over WebSocket."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ovra-daemon"
path = "src/main.rs"

[features]
# `--fake-agent`: a scripted agent instead of the user's `claude`, for e2e
# tests and UX reviews. Off in release builds.
fake-agent = ["ovra-core/fakes", "dep:serde_json"]

[dependencies]
ovra-core.workspace = true
ovra-fs-index.workspace = true
ovra-opener.workspace = true
ovra-pty.workspace = true
ovra-agent-runtime.workspace = true
ovra-worktree.workspace = true
ovra-mcp-server.workspace = true
ovra-store.workspace = true
ovra-sandbox.workspace = true
ovra-transport = { workspace = true, features = ["ws"] }
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
rand.workspace = true
serde_json = { workspace = true, optional = true }
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
