[package]
name = "ovra-lsp"
description = "Language servers through the sandbox (implements ovra_core::services::LanguageServers)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# `fake-server`: a stand-in language server on stdio, for tests and e2e.
fake-server = []

[[bin]]
name = "fake-lsp"
path = "src/bin/fake-lsp.rs"
required-features = ["fake-server"]
test = false

[[test]]
name = "fake_server"
required-features = ["fake-server"]

[dependencies]
ovra-core.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
ovra-core = { workspace = true, features = ["fakes"] }
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
