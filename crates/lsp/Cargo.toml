[package]
name = "ovra-lsp"
description = "Language servers through the sandbox (implements ovra_core::services::LanguageServers)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ovra-core.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
ovra-core = { workspace = true, features = ["fakes"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
