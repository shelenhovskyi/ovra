[package]
name = "ovra-acp-client"
description = "Runs agent sessions of agents that speak ACP, the Agent Client Protocol (implements ovra_core::services::AgentRuntime, ADR 0011)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# `fake-acp`: a stand-in ACP agent that plays scripted sessions, for tests.
fake-acp = []

[[bin]]
name = "fake-acp"
path = "src/bin/fake-acp.rs"
required-features = ["fake-acp"]
test = false

[[test]]
name = "fake_agent"
required-features = ["fake-acp"]

[dependencies]
ovra-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
ovra-core = { workspace = true, features = ["fakes"] }
insta.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
