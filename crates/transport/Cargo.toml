[package]
name = "ovra-transport"
description = "Wire framing between front ends and the core, plus the WebSocket server used in headless mode."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
ws = ["dep:axum", "dep:futures-util", "dep:tokio", "dep:tracing"]

[dependencies]
ovra-core.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
ovra-core = { workspace = true, features = ["fakes"] }
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

[lints]
workspace = true
