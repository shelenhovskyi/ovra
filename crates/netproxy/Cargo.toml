[package]
name = "ovra-netproxy"
description = "Per-session HTTP proxies with a host allowlist, the only way out of an agent sandbox (implements ovra_core::services::NetProxy)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ovra-core.workspace = true
httparse = "1"
rand.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }
rcgen = "0.14"
rustls-native-certs = "0.8"
time = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
zeroize = "1"

[dev-dependencies]
ovra-core = { workspace = true, features = ["fakes"] }
insta.workspace = true
tokio = { workspace = true, features = ["macros", "test-util"] }

[lints]
workspace = true
