[package]
name = "ovra-agent-runtime"
description = "Runs agent sessions; Claude through the user's installed claude CLI (implements ovra_core::services::AgentRuntime)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ovra-core.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
ovra-core = { workspace = true, features = ["fakes"] }
insta.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
