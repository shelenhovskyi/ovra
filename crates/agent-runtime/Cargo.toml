[package]
name = "ovra-agent-runtime"
description = "Runs agent sessions; Claude through the user's installed claude CLI (implements ovra_core::services::AgentRuntime)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# `fake-claude`: a stand-in `claude` that plays a recorded session, for e2e.
fake-claude = []

[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"
required-features = ["fake-claude"]
test = false

[dependencies]
ovra-core.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { version = "=1.26.1", features = ["v4"] }

[dev-dependencies]
ovra-core = { workspace = true, features = ["fakes"] }
insta.workspace = true
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
