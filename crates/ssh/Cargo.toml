[package]
name = "ovra-ssh"
description = "Remote machines over the person's own OpenSSH (ADR 0016; security code). Implements ovra_core::services::RemoteHosts."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ovra-core.workspace = true
ovra-transport = { workspace = true, features = ["stdio"] }
rand.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
insta.workspace = true
tempfile = "3"

[lints]
workspace = true
