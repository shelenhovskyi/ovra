[package]
name = "ovra-sandbox"
description = "What every platform's agent sandbox shares: the protected paths, and the sandbox for this OS (implements ovra_core::services::Sandbox)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ovra-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ovra-sandbox-linux.workspace = true

[target.'cfg(windows)'.dependencies]
ovra-sandbox-windows.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
