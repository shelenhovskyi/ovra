[package]
name = "ovra-worktree"
description = "Git worktrees, working-tree snapshots and review diffs (implements ovra_core::services::Worktrees)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ovra-core.workspace = true
tokio = { workspace = true, features = ["rt"] }

[target.'cfg(unix)'.dependencies]
# `openat`/`unlinkat`: deleting under a folder an agent may swap for a link.
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
ovra-core = { workspace = true, features = ["fakes"] }
insta.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
