[package]
name = "ovra-browser"
description = "The agent browser: a sandboxed Chromium driven over a CDP pipe (implements ovra_core::services::Browser)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.22"
ovra-core.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
ovra-core = { workspace = true, features = ["fakes"] }
insta.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
