[package]
name = "ovra-secrets"
description = "Secrets in the OS keychain, each bound to one project, host and header (implements ovra_core::services::Secrets)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ovra-core.workspace = true
keyring-core = "=1.1.0"
rand.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.3", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "=1.1.0"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
