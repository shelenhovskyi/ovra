[workspace]
resolver = "3"
members = ["crates/*", "app"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/shelenhovskyi/ovra"
rust-version = "1.90"

[workspace.dependencies]
ovra-core = { path = "crates/core" }
ovra-transport = { path = "crates/transport" }
ovra-fs-index = { path = "crates/fs-index" }
ovra-store = { path = "crates/store" }
ovra-opener = { path = "crates/opener" }
ovra-pty = { path = "crates/pty" }
ovra-agent-runtime = { path = "crates/agent-runtime" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal"] }
tokio-tungstenite = "0.27"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
insta = { version = "1", features = ["json", "redactions"] }

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
