name: Security

# Static analysis (CodeQL), workflow audit (zizmor) and a daily advisory scan:
# new RustSec advisories appear without any change in this repository.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('security-{0}', github.ref) || format('security-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  zizmor:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: 1.33.1
          advanced-security: false

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny
      - run: cargo deny check advisories
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - run: pnpm audit --prod --audit-level high

  codeql:
    name: CodeQL (${{ matrix.language }})
    # Daily and on pull requests, not on every agent push to main: that keeps
    # the queue short, and the daily run catches what landed.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
          output: sarif
      # Agents cannot read the code scanning API, so the weekly alert pass
      # reads the findings from this log (docs/security-alerts.md).
      - name: List findings
        run: |
          jq -r '.runs[].results[] | [.ruleId, (.level // "warning"),
            "\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)",
            (.message.text | split("\n")[0])] | @tsv' sarif/*.sarif | tee findings.tsv
          echo "findings: $(wc -l < findings.tsv)"
