name: Site

# Builds site/ and publishes it to GitHub Pages: after every CI run on main
# (so the Speed page picks up the new speed gate results), when the site or
# the docs change, and by hand.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - tests/perf/targets.json
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  # Gated below to pushes to this repository's main.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer one waits instead of cancelling a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_run also fires for pull requests (a fork's branch may be called
    # main); only pushes to this repository's main may publish the site.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ovra/site
      - name: Download speed gate results
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-perf-results.sh site/perf-data
      - run: pnpm --filter @ovra/site build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
