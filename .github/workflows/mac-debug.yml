name: E2E debug (temporary)
on:
  push:
    branches: [claude/project-thread-x2b5w2]
permissions:
  contents: read
jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just,cargo-nextest
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev ripgrep bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'macOS'
        name: Rust budget with the /usr/bin/git shim first on PATH
        run: |
          export PATH=/usr/bin:$PATH
          which git; git --exec-path
          cargo nextest run --workspace --exclude ovra-app --all-features --no-tests=pass > /dev/null 2>&1 || echo FAILED
          python3 scripts/check_test_budgets.py rust || true
          cargo nextest run --workspace --exclude ovra-app --all-features --no-tests=pass > /dev/null 2>&1 || echo FAILED
          python3 scripts/check_test_budgets.py rust || true
      - run: just build-headless
      - run: pnpm --filter @ovra/e2e exec playwright install --with-deps chromium
      - name: e2e
        env:
          OVRA_E2E_SCREENSHOTS: "1"
          RUST_LOG: debug
        run: pnpm --filter @ovra/e2e exec playwright test --reporter=list --trace off specs/claude-driver.spec.ts specs/lsp.spec.ts specs/git.spec.ts 2>&1 | grep -v inotify
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ matrix.os }}
          path: tests/e2e/test-results/
          retention-days: 3
