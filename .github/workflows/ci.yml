name: CI

# Linux checks run on every push to main and every PR. The slow jobs run on
# PRs, on demand, and on main when it got new commits: the speed gate hourly,
# the desktop builds on three OSes daily. Only PR runs cancel each other:
# every commit on main gets a complete run.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # speed gate
    - cron: "43 2 * * *" # desktop builds
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: Checks, tests, e2e (Linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny,cargo-machete
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev ripgrep
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ovra/ui build
      - run: just lint
      - run: just test
      - run: pnpm --filter @ovra/e2e exec playwright install --with-deps chromium
      - run: just e2e

  # Decides which slow jobs run. PRs and manual runs get all of them. The
  # hourly schedule runs the speed gate and the daily one the desktop builds,
  # each only when main got commits since the previous window.
  slow:
    name: Slow jobs needed?
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    outputs:
      perf: ${{ steps.decide.outputs.perf }}
      app: ${{ steps.decide.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          perf=true app=true
          if [ "$EVENT" = schedule ]; then
            age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
            if [ "$CRON" = "17 * * * *" ]; then
              app=false; [ "$age" -lt 3600 ] || perf=false
            else
              perf=false; [ "$age" -lt 86400 ] || app=false
            fi
          fi
          echo "perf=$perf" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "speed gate: $perf, desktop builds: $app"

  perf:
    name: Speed gate (100k-file repo)
    needs: slow
    if: needs.slow.outputs.perf == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ovra/perf exec playwright install --with-deps chromium
      - run: just perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: tests/perf/test-results/
          retention-days: 30

  app:
    name: Desktop app (${{ matrix.os }})
    needs: slow
    if: needs.slow.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: pnpm install --frozen-lockfile
      - name: Build app (UI + Tauri, no installers)
        run: pnpm exec tauri build --no-bundle
      - name: Core tests
        run: cargo test --workspace --exclude ovra-app --all-features
      - uses: actions/upload-artifact@v4
        with:
          name: ovra-${{ matrix.os }}
          path: |
            target/release/ovra
            target/release/ovra.exe
          if-no-files-found: error
          retention-days: 7
