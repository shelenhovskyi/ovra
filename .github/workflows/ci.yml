name: CI

# Branch-only spike for task 5.A; main keeps the real CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: cargo build --release --manifest-path spike/win-sandbox/Cargo.toml
      - name: Probe
        shell: pwsh
        run: |
          $exe = "spike/win-sandbox/target/release/win-sandbox-spike.exe"
          $env:SPIKE_HOLD = "1"
          whoami; whoami /groups | Select-String -Pattern "Mandatory|Administrators"
          $p = Start-Process $exe -ArgumentList host -RedirectStandardOutput host.txt -RedirectStandardError host-err.txt -PassThru -NoNewWindow
          for ($i = 0; $i -lt 300 -and -not (Test-Path C:\ovra-spike\ready.txt); $i++) { Start-Sleep -Milliseconds 200 }
          Get-Content host.txt; Get-Content host-err.txt
          $pw = "Sp" + [guid]::NewGuid().ToString() + "Aa1!"
          $sec = ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser -Name OvraSpike -Password $sec -AccountNeverExpires | Out-Null
          $sid = (Get-LocalUser OvraSpike).SID.Value
          icacls C:\ovra-spike /grant "OvraSpike:(OI)(CI)F" /T | Out-Null
          $cred = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\OvraSpike", $sec)
          $port = Get-Content C:\ovra-spike\port.txt
          $pargs = @("probe", $port, "$env:USERPROFILE\.ovra-spike-secret", $env:USERPROFILE, "C:\ovra-spike", "C:\ovra-spike\s.sock")
          function RunAsUser($name) {
            try {
              Start-Process C:\ovra-spike\spike.exe -ArgumentList $pargs -Credential $cred -LoadUserProfile -Wait -WorkingDirectory C:\ovra-spike -RedirectStandardOutput "C:\ovra-spike\$name.txt" -RedirectStandardError "C:\ovra-spike\$name-err.txt"
              "=== $name ==="; Get-Content "C:\ovra-spike\$name.txt"; Get-Content "C:\ovra-spike\$name-err.txt"
            } catch { "=== $name FAILED: $_" }
          }
          # user runs done in spike 1
          New-Item C:\ovra-spike\done.txt | Out-Null
          $p.WaitForExit(10000) | Out-Null
