name: CI

# Every push to main gets a complete run on all jobs; only PR runs cancel
# each other.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: Checks, tests, e2e (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny,cargo-machete
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev ripgrep
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ovra/ui build
      - run: just lint
      - run: just test
      - run: pnpm --filter @ovra/e2e exec playwright install --with-deps chromium
      - run: just e2e

  perf:
    name: Speed gate (100k-file repo)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ovra/perf exec playwright install --with-deps chromium
      - run: just perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: tests/perf/test-results/
          retention-days: 30

  app:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: pnpm install --frozen-lockfile
      - name: Build app (UI + Tauri, no installers)
        run: pnpm exec tauri build --no-bundle
      - name: Core tests
        run: cargo test --workspace --exclude ovra-app --all-features --no-fail-fast
      - uses: actions/upload-artifact@v4
        with:
          name: ovra-${{ matrix.os }}
          path: |
            target/release/ovra
            target/release/ovra.exe
          if-no-files-found: error
          retention-days: 7
