# Test time limits (see "Test speed" in CLAUDE.md and scripts/test-budgets.json).
experimental = ["wrapper-scripts"]

[profile.default]
# A test is reported as slow after 1 s and killed after 3 s.
slow-timeout = { period = "1s", terminate-after = 3 }
fail-fast = false

[profile.default.junit]
path = "junit.xml"

# The Rust budget is checked against each test's CPU time, which load from
# other work on the machine does not change; this wrapper records it.
[scripts.wrapper.cpu-time]
command = { command-line = "scripts/test-cpu.sh", relative-to = "workspace-root" }

[[profile.default.scripts]]
platform = "cfg(unix)"
filter = "all()"
run-wrapper = "cpu-time"

# Tests that run real git start many short processes. On Windows and macOS
# runners process starts slow each other down when many run at once, so
# these run at most two at a time; on Linux that costs almost nothing.
[test-groups]
git = { max-threads = 2 }

[[profile.default.overrides]]
filter = "package(ovra-worktree)"
test-group = "git"
